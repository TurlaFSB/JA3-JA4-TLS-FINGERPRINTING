# ci.yml

name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v4
      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - name: Install Rust ${{ matrix.rust }}
        run: rustup toolchain install ${{ matrix.rust }} --component clippy --component rustfmt --profile minimal
      - name: Build
        run: cargo +${{ matrix.rust }} build --workspace --all-targets
      - name: Test
        run: cargo +${{ matrix.rust }} test --workspace

  windows:
    # Builds the Windows binary against the Npcap SDK and checks what can be
    # checked without a capture driver: the program starts, reads a capture
    # file and refuses live capture with a clear message, instead of failing to
    # load wpcap.dll. Live capture itself cannot be tested here: the free Npcap
    # installer cannot run unattended.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the Npcap SDK (build only)
        shell: pwsh
        run: |
          Invoke-WebRequest https://npcap.com/dist/npcap-sdk-1.13.zip -OutFile sdk.zip
          (Get-FileHash sdk.zip -Algorithm SHA256).Hash
          Expand-Archive sdk.zip sdk
          "LIB=$PWD\sdk\Lib\x64" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build
        run: cargo build --locked --bin tlsfp
      - name: Starts and reads a capture file without Npcap
        shell: pwsh
        run: |
          .\target\debug\tlsfp.exe --version
          if ($LASTEXITCODE -ne 0) { throw "tlsfp --version exited $LASTEXITCODE" }
          $out = .\target\debug\tlsfp.exe pcap testdata\pcap\tls-handshake.pcapng --json
          if ($LASTEXITCODE -ne 0) { throw "pcap exited $LASTEXITCODE" }
          if (($out | Select-String "client_hello").Count -lt 5) { throw "expected client hellos" }
      - name: Live capture without Npcap fails with a message, not a crash
        shell: pwsh
        run: |
          $msg = .\target\debug\tlsfp.exe interfaces 2>&1 | Out-String
          Write-Host "exit $LASTEXITCODE"; Write-Host $msg
          if ($LASTEXITCODE -ne 0 -and $msg -notmatch "Npcap") { throw "no helpful message" }
          if ($LASTEXITCODE -lt 0 -or $LASTEXITCODE -gt 1) { throw "crashed with $LASTEXITCODE" }
          # Exit code 1 is the expected, clean refusal; do not let it fail the step.
          exit 0
      - name: Test the engine and the intelligence store
        run: cargo test --locked -p tlsfp-core -p tlsfp-intel

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - name: Install Rust
        run: rustup toolchain install stable --component clippy --component rustfmt --profile minimal
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - name: Build
        run: cargo build --release --bin tlsfp
      - name: Fingerprint evaluation reproduces committed results
        run: |
          for v in v0.1 v0.2 v0.3 v0.4; do
            python3 eval/evaluate.py --dataset dataset/$v --out eval/results/$v --check
          done
      - name: Impersonation fidelity reproduces committed results
        run: |
          python3 eval/identify.py --dataset dataset/v0.3 --dataset dataset/v0.6 --out eval/results/identify --check
          python3 eval/fidelity.py --dataset dataset/v0.4 --out eval/results/v0.4 --check
          python3 eval/fidelity.py --dataset dataset/v0.6 --out eval/results/v0.6 --check
      - name: Cross-layer rule evaluation reproduces committed results
        run: |
          python3 eval/scenarios.py --dataset dataset/v0.5 --out eval/results/v0.5 --check
          python3 eval/crosslayer.py --dataset dataset/v0.5 --out eval/results/v0.5 --check
      - name: Detection evaluation reproduces committed results
        run: python3 eval/detections.py --dataset dataset/v0.3 --feed-dataset dataset/v0.2 dataset/v0.4 --out eval/results/v0.3 --check
      - name: Lab intelligence feed matches its generator
        run: |
          python3 dataset/lab/make_intel_feed.py --dataset dataset/v0.2 --real-dataset dataset/v0.4 --out "$RUNNER_TEMP/lab-clients.csv"
          diff "$RUNNER_TEMP/lab-clients.csv" crates/tlsfp-intel/seeds/lab-clients.csv

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.29.1 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm exec biome check .
      - name: Typecheck
        run: pnpm typecheck
      - name: Stylelint
        run: pnpm lint:scss
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
