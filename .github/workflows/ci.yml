# ci.yml

name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v4
      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - name: Install Rust ${{ matrix.rust }}
        run: rustup toolchain install ${{ matrix.rust }} --component clippy --component rustfmt --profile minimal
      - name: Build
        run: cargo +${{ matrix.rust }} build --workspace --all-targets
      - name: Test
        run: cargo +${{ matrix.rust }} test --workspace

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - name: Install Rust
        run: rustup toolchain install stable --component clippy --component rustfmt --profile minimal
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - name: Build
        run: cargo build --release --bin tlsfp
      - name: Fingerprint evaluation reproduces committed results
        run: |
          for v in v0.1 v0.2 v0.3; do
            python3 eval/evaluate.py --dataset dataset/$v --out eval/results/$v --check
          done
      - name: Detection evaluation reproduces committed results
        run: python3 eval/detections.py --dataset dataset/v0.3 --feed-dataset dataset/v0.2 --out eval/results/v0.3 --check
      - name: Lab intelligence feed matches its generator
        run: |
          python3 dataset/lab/make_intel_feed.py --dataset dataset/v0.2 --out "$RUNNER_TEMP/lab-clients.csv"
          diff "$RUNNER_TEMP/lab-clients.csv" crates/tlsfp-intel/seeds/lab-clients.csv

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.29.1 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm exec biome check .
      - name: Typecheck
        run: pnpm typecheck
      - name: Stylelint
        run: pnpm lint:scss
      - name: Build
        run: pnpm build
