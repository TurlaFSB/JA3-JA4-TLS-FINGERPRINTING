# © Pranav Verma | 2026
# release.yml
#
# Runs when a version tag is pushed. Builds the Linux x86_64 and Windows
# x86_64 binaries with the dashboard assets, attaches them to a GitHub release
# with SHA-256 files and build provenance attestations, and publishes the two
# container images to the GitHub Container Registry. See RELEASING.md for the
# tagging procedure.
#
# Run by hand (Actions > release > Run workflow) it is a dry run: the same
# builds and packaging, with the archives and image builds checked and kept as
# downloadable artifacts, but nothing published, attested or pushed.

name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the workspace version
        id: v
        run: |
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "dry run: using the workspace version $crate"
            echo "version=$crate" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$crate" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $crate" >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  binary:
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the dashboard
        working-directory: frontend
        run: |
          corepack enable && corepack prepare pnpm@10.29.1 --activate
          pnpm install --frozen-lockfile
          pnpm build
      - name: Build tlsfp
        run: cargo build --release --locked --bin tlsfp
      - name: Package
        run: |
          name="tlsfp-${{ needs.verify.outputs.version }}-linux-x86_64"
          mkdir -p "dist/$name"
          cp target/release/tlsfp "dist/$name/"
          cp -r frontend/dist "dist/$name/web"
          cp LICENSE NOTICE.md README.md CHANGES.md "dist/$name/"
          tar -C dist -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-archive
          path: |
            tlsfp-*.tar.gz
            tlsfp-*.tar.gz.sha256
          retention-days: 7
      - name: The archive can be read back and starts
        run: |
          sha256sum -c tlsfp-*.tar.gz.sha256
          mkdir check && tar -C check -xzf tlsfp-*.tar.gz
          check/tlsfp-*/tlsfp --version
          test -f check/tlsfp-*/web/index.html
      - uses: actions/attest-build-provenance@v2
        if: github.ref_type == 'tag'
        with:
          subject-path: tlsfp-*.tar.gz
      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" tlsfp-*.tar.gz tlsfp-*.tar.gz.sha256 \
            --title "$GITHUB_REF_NAME" --generate-notes

  windows:
    needs: [verify, binary]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the Npcap SDK (build only)
        shell: pwsh
        run: |
          Invoke-WebRequest https://npcap.com/dist/npcap-sdk-1.13.zip -OutFile sdk.zip
          Expand-Archive sdk.zip sdk
          "LIB=$PWD\sdk\Lib\x64" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the dashboard
        working-directory: frontend
        run: |
          corepack enable
          corepack prepare pnpm@10.29.1 --activate
          pnpm install --frozen-lockfile
          pnpm build
      - name: Build tlsfp
        run: cargo build --release --locked --bin tlsfp
      - name: Package
        shell: pwsh
        run: |
          $name = "tlsfp-${{ needs.verify.outputs.version }}-windows-x86_64"
          New-Item -ItemType Directory -Path "dist\$name" | Out-Null
          Copy-Item target\release\tlsfp.exe "dist\$name\"
          Copy-Item -Recurse frontend\dist "dist\$name\web"
          Copy-Item scripts\start-windows.ps1 "dist\$name\"
          Copy-Item LICENSE, NOTICE.md, README.md, CHANGES.md "dist\$name\"
          Compress-Archive -Path "dist\$name" -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-archive
          path: |
            tlsfp-*.zip
            tlsfp-*.zip.sha256
          retention-days: 7
      - name: The archive can be read back and starts without Npcap
        shell: pwsh
        run: |
          Expand-Archive tlsfp-*.zip check
          $dir = (Get-ChildItem check | Select-Object -First 1).FullName
          & "$dir\tlsfp.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "tlsfp.exe --version exited $LASTEXITCODE" }
          if (-not (Test-Path "$dir\web\index.html")) { throw "the dashboard is missing from the archive" }
          if (-not (Test-Path "$dir\start-windows.ps1")) { throw "the start script is missing" }
      - uses: actions/attest-build-provenance@v2
        if: github.ref_type == 'tag'
        with:
          subject-path: tlsfp-*.zip
      - name: Add to the release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$env:GITHUB_REF_NAME" (Get-ChildItem tlsfp-*.zip, tlsfp-*.zip.sha256)

  images:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: tlsfp
            dockerfile: infra/docker/tlsfp.prod
          - name: tlsfp-dashboard
            dockerfile: infra/docker/vite.prod
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
